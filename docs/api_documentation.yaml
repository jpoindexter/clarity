openapi: 3.0.0
info:
  title: Clarity Reports API
  description: API documentation for financial intelligence reports.
  version: 1.0.0
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - ApiKeyAuth: []
servers:
  - url: "http://localhost:8000"
    description: Local development server
  - url: "https://api.clarityreports.com"
    description: Production server
paths:
  /fetch-news:
    get:
      summary: Fetch latest financial news
      description: Retrieves financial news articles from various sources.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                      description: Headline of the article
                    source:
                      type: string
                      description: News source
                    published_at:
                      type: string
                      format: date-time
        "400":
          description: Bad request (invalid input)
        "401":
          description: Unauthorized (invalid API key)
        "500":
          description: Internal server error

  /analyze-news:
    post:
      summary: Run AI processing on financial headlines
      description: Uses AI to detect contradictions, sentiment, and credibility scores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Financial news text to analyze
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                    description: AI-generated summary
                  sentiment:
                    type: string
                    description: Sentiment analysis result (Bullish, Bearish, Neutral)
                  credibility_score:
                    type: integer
                    description: AI-generated credibility rating (0-100)
        "400":
          description: Bad request (invalid input)
        "401":
          description: Unauthorized (invalid API key)
        "500":
          description: Internal server error

  /generate-report:
    post:
      summary: Generate an AI-powered market intelligence report
      description: Compiles AI insights into a structured PDF report.
      responses:
        "200":
          description: Report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: string
                    description: Unique ID of the generated report
        "400":
          description: Bad request (invalid input)
        "401":
          description: Unauthorized (invalid API key)
        "500":
          description: Internal server error

  /get-report/{id}:
    get:
      summary: Retrieve a generated report
      description: Fetches an AI-generated PDF intelligence report.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF report retrieved
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request (invalid input)
        "401":
          description: Unauthorized (invalid API key)
        "500":
          description: Internal server error