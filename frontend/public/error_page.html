<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - AI News Platform</title>
    <link rel="stylesheet" href="global_styles.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .error-title {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 10px;
        }
        .error-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        .error-button {
            margin-top: 20px;
            background-color: var(--button-bg);
            color: var(--button-text);
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }
        .error-button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-title">Oops! Something went wrong.</h1>
        <p class="error-message">The page you are looking for might be temporarily unavailable or does not exist.</p>
        <a href="/" class="error-button">Go Back Home</a>
    </div>
</body>
</html>
