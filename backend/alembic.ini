# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = backend/migrations

# Uncomment to prepend date/time to migration filenames
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend current working directory to sys.path
prepend_sys_path = .

# Default version path separator
version_path_separator = os

# Output encoding for migration files
output_encoding = utf-8

# Database connection URL (without +psycopg2)
sqlalchemy.url = postgresql://jpoindexter:dontforgetme@localhost:5432/clarity

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S