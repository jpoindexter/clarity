# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# File template for migration names
# Uncomment below to prepend migration files with date and time
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Timezone settings for migrations
# timezone =

# Max length for slug in migration filenames
# truncate_slug_length = 40

# Automatically run the environment during "revision" command
# revision_environment = false

# Allow .pyc and .pyo files to be detected as revisions
# sourceless = false

# Migration versions directory
version_locations = alembic/versions

# Version path separator
version_path_separator = os

# Encoding for revision files
# output_encoding = utf-8

# ✅ Updated Database Connection
sqlalchemy.url = postgresql://jpoindexter:dontforgetme@localhost:5432/clarity

[post_write_hooks]
# Enable auto-formatting for migrations using "black"
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Enable linting and auto-fixing using "ruff"
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
